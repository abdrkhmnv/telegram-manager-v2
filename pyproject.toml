[project]
name = "telegram-manager-v2"
version = "0.1.0"
description = "Bitta shaxsiy Telegram akkauntini Control Bot orqali boshqarish tizimi"
readme = "README.md"
requires-python = ">=3.11"
# Aniq (pinned) versiyalar requirements.txt va requirements-dev.txt fayllarida.
dependencies = [
    "sqlalchemy[asyncio]>=2.0.41,<2.1",
    "asyncpg>=0.30.0,<0.31",
    "alembic>=1.16.1,<1.17",
    "pydantic>=2.11.5,<3",
    "pydantic-settings>=2.9.1,<3",
    "tzdata>=2025.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["storage", "logs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "S",    # bandit (xavfsizlik)
    "ASYNC",
    "RUF",
    "SIM",
    "DTZ",  # timezone-naive datetime ishlatilishini taqiqlaydi
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # o'zbekcha matndagi maxsus belgilar (ʻ, ’)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"database/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["app", "core", "database", "utils", "main.py"]
exclude = ["database/migrations/"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: haqiqiy PostgreSQL talab qiladigan testlar (TEST_DATABASE_URL)",
]
filterwarnings = ["error::DeprecationWarning:app.*", "error::DeprecationWarning:database.*"]
